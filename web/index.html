<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven's Calendar</title><link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script><style>:root{color-scheme:dark;--ink:#f4ead8;--muted:#b9aa96;--panel:#211d2a;--gold:#d9a441}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#45334a,#151520 60%);color:var(--ink);font:15px system-ui,sans-serif}main{max-width:1200px;margin:0 auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}h1{margin:0;font:600 2rem Georgia,serif;letter-spacing:.02em}p{color:var(--muted)}#calendar{background:#24202d;border:1px solid #514258;border-radius:14px;padding:16px;box-shadow:0 20px 60px #0005}.fc{--fc-border-color:#514258;--fc-page-bg-color:transparent;--fc-neutral-bg-color:#2b2534;--fc-list-event-hover-bg-color:#3b3145;--fc-today-bg-color:#d9a44114}.fc .fc-button{background:#574366;border:0}.fc .fc-button-primary:not(:disabled).fc-button-active{background:var(--gold);color:#201b25}.fc .fc-toolbar-title{font:600 1.3rem Georgia,serif}.fc-event{border:0;border-left:4px solid var(--event-color,#d9a441);padding:2px 4px;white-space:normal;overflow-wrap:anywhere}.fc .fc-daygrid-event .fc-event-main{white-space:normal}.fc-daygrid-event-dot{border-color:var(--event-color,#d9a441)}.posture{font-size:.72rem;opacity:.8;text-transform:uppercase;letter-spacing:.08em}</style></head><body><main><header><div><h1>Seven's Calendar</h1><p>Private temporal instrument · Archive House at dusk</p></div><div id="status"></div></header><div id="calendar"></div></main><script>const postureColors={event:'#d99b5b',preparation:'#8c78b5',window:'#d9a441',recognition:'#6faaa2',rhythm:'#9a789f'};document.addEventListener('DOMContentLoaded',()=>{const BASE_PATH=new URL('.',window.location.href).pathname.replace(/\/$/,'');const cal=new FullCalendar.Calendar(document.getElementById('calendar'),{initialView:'dayGridMonth',height:'auto',firstDay:1,headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,timeGridWeek,timeGridDay,listWeek'},events:(info,success,failure)=>fetch(BASE_PATH+'/api/events?start='+encodeURIComponent(info.startStr)+'&end='+encodeURIComponent(info.endStr)).then(r=>r.json()).then(items=>success(items.map(e=>({id:e.id,title:e.title,start:e.start,end:e.end,backgroundColor:e.color||postureColors[e.posture],borderColor:e.color||postureColors[e.posture],extendedProps:e})))) .catch(failure),eventContent:arg=>{const e=arg.event.extendedProps;return {html:`<span class="posture">${e.marker?'◆ '+e.marker+' · ':''}${e.posture}</span> ${arg.event.title}`}},eventDidMount:arg=>arg.el.style.setProperty('--event-color',arg.event.backgroundColor)});cal.render()});</script></body></html>
