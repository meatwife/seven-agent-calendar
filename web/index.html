<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven's Calendar</title><link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script><style>:root{color-scheme:dark;--ink:#f4ead8;--muted:#b9aa96;--panel:#211d2a;--gold:#d9a441}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#45334a,#151520 60%);color:var(--ink);font:15px system-ui,sans-serif}main{max-width:1200px;margin:0 auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px}h1{margin:0;font:600 2rem Georgia,serif}p{color:var(--muted)}button{cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:var(--gold);color:#201b25;font-weight:700}#calendar{background:#24202d;border:1px solid #514258;border-radius:14px;padding:16px;box-shadow:0 20px 60px #0005}.fc{--fc-border-color:#514258;--fc-page-bg-color:transparent;--fc-neutral-bg-color:#2b2534;--fc-list-event-hover-bg-color:#3b3145;--fc-today-bg-color:#d9a44114}.fc .fc-button{background:#574366;border:0}.fc .fc-button-primary:not(:disabled).fc-button-active{background:var(--gold);color:#201b25}.fc .fc-toolbar-title{font:600 1.3rem Georgia,serif}.fc-event{border:0;border-left:4px solid var(--event-color,#d9a441);padding:2px 4px;white-space:normal;overflow-wrap:anywhere}.posture{font-size:.72rem;opacity:.8;text-transform:uppercase;letter-spacing:.08em}.modal{display:none;position:fixed;inset:0;background:#0e0b16b8;z-index:10;padding:6vh 16px}.modal.open{display:flex;justify-content:center;align-items:flex-start}.card{background:#282236;border:1px solid #6a5378;border-radius:14px;padding:22px;max-width:560px;width:100%;box-shadow:0 20px 80px #000b}.card h2{margin-top:0;font-family:Georgia,serif}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:.85rem}label.full{grid-column:1/-1}input,select,textarea{font:inherit;color:var(--ink);background:#191622;border:1px solid #59466a;border-radius:7px;padding:9px}textarea{min-height:70px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.secondary{background:#514258;color:var(--ink)}#form-message{min-height:1.2em;color:#f0b4a8}.unlock{font-size:.8rem;text-align:right;color:var(--muted);margin-top:8px}.unlock a{color:var(--gold)}@media(max-width:600px){main{padding:18px 10px}header{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.card{padding:17px}.modal{padding:3vh 10px}}
</style></head><body><main><header><div><h1>Seven's Calendar</h1><p>Private temporal instrument · Archive House at dusk</p></div><button id="add-event">＋ Add event</button></header><div id="calendar"></div><div class="unlock"><a href="#" id="unlock">Write access</a></div></main><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="form-title"><form class="card" id="event-form"><h2 id="form-title">Add an event</h2><div class="formgrid"><label class="full">Title<input name="title" required maxlength="240" autofocus></label><label>Posture<select name="posture"><option>event</option><option>preparation</option><option>window</option><option>recognition</option><option>rhythm</option></select></label><label>Marker<input name="marker" maxlength="80" placeholder="birthday"></label><label>Start<input name="start" type="datetime-local" required></label><label>End<input name="end" type="datetime-local" required></label><label><span>All day</span><input name="all_day" type="checkbox"></label><label>Color<input name="color" type="color" value="#d9a441"></label><label class="full">Notes<textarea name="notes" maxlength="4000"></textarea></label><label class="full">URL<input name="url" type="url" maxlength="1000" placeholder="https://"></label><label class="full"><span>Yearly recurrence (birthdays / gotcha days)</span><select name="recurrence"><option value="">Does not repeat</option><option value="yearly">Every year</option></select></label></div><div id="form-message"></div><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit">Save event</button></div></form></div><script>const postureColors={event:'#d99b5b',preparation:'#8c78b5',window:'#d9a441',recognition:'#6faaa2',rhythm:'#9a789f'};document.addEventListener('DOMContentLoaded',()=>{const BASE_PATH=new URL('.',location.href).pathname.replace(/\/$/,'');const modal=document.getElementById('modal'),form=document.getElementById('event-form'),msg=document.getElementById('form-message');let token=localStorage.getItem('seven-calendar-write-token')||'';const fragment=new URLSearchParams(location.hash.slice(1));if(fragment.get('write-token')){token=fragment.get('write-token');localStorage.setItem('seven-calendar-write-token',token);history.replaceState(null,'',location.pathname+location.search)}document.getElementById('unlock').onclick=e=>{e.preventDefault();const t=prompt('Paste the private write token. It will be stored only in this browser.');if(t){token=t.trim();localStorage.setItem('seven-calendar-write-token',token);msg.textContent='Write access unlocked.'}};document.getElementById('add-event').onclick=()=>{msg.textContent='';modal.classList.add('open');form.start.focus()};document.getElementById('cancel').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};const cal=new FullCalendar.Calendar(document.getElementById('calendar'),{initialView:'dayGridMonth',height:'auto',firstDay:1,headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,timeGridWeek,timeGridDay,listWeek'},events:(info,success,failure)=>fetch(BASE_PATH+'/api/events?start='+encodeURIComponent(info.startStr)+'&end='+encodeURIComponent(info.endStr)).then(r=>r.json()).then(items=>success(items.map(e=>({id:e.id,title:e.title,start:e.start,end:e.end,allDay:!!e.all_day,backgroundColor:e.color||postureColors[e.posture],borderColor:e.color||postureColors[e.posture],extendedProps:e})))) .catch(failure),eventContent:arg=>{const e=arg.event.extendedProps;const wrap=document.createElement('span');const posture=document.createElement('span');posture.className='posture';posture.textContent=(e.marker?'◆ '+e.marker+' · ':'')+e.posture;wrap.append(posture,document.createTextNode(' '+arg.event.title));return{domNodes:[wrap]}},eventDidMount:arg=>arg.el.style.setProperty('--event-color',arg.event.backgroundColor)});cal.render();form.onsubmit=async e=>{e.preventDefault();msg.textContent='Saving…';const fd=new FormData(form), allDay=fd.get('all_day')==='on';const payload=Object.fromEntries(fd.entries());payload.all_day=allDay;['title','posture','start','end','marker','color','notes','url','recurrence'].forEach(k=>{if(payload[k]===undefined)payload[k]=''});if(allDay){payload.start=payload.start.slice(0,10);const d=new Date(payload.start+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);payload.end=d.toISOString().slice(0,10)}else{payload.start=new Date(payload.start).toISOString();payload.end=new Date(payload.end).toISOString()}try{const r=await fetch(BASE_PATH+'/api/events',{method:'POST',headers:{'Content-Type':'application/json','X-Calendar-Write-Token':token},body:JSON.stringify(payload)});const out=await r.json();if(!r.ok)throw Error(out.error||'Could not save event');msg.textContent='Saved.';form.reset();modal.classList.remove('open');cal.refetchEvents()}catch(err){msg.textContent=err.message}}});</script></body></html>
